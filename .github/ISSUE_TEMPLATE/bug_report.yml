name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Volco version
      description: Settings → General, or the release you downloaded.
      placeholder: v1.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: hardware
    attributes:
      label: Controller
      description: The board, how many sliders and buttons, which indicators (LED, LED pair, screen), and the connection (USB, UDP, WebSocket, the simulator).
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant part of `%APPDATA%\Volco\volco.log`. Turn on detailed logging in Settings → General for more.
      render: text
