name: Build Volco

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_build:
        description: 'Also run the Build and Publish job'
        type: boolean
        default: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        cache: true
        cache-dependency-path: Volco.sln

    - name: Test
      run: |
        dotnet test tests/Volco.Core.Tests/Volco.Core.Tests.csproj \
          --configuration Release
        dotnet test tests/Volco.App.Tests/Volco.App.Tests.csproj \
          --configuration Release

  firmware-test:
    name: Firmware Tests
    runs-on: ubuntu-latest
    outputs:
      build-id: ${{ steps.fwid.outputs.id }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install PlatformIO
      run: pip install platformio==6.1.19

    - name: Firmware build id
      id: fwid
      run: |
        python firmware/tools/check_firmware_id_paths.py
        echo "id=$(bash firmware/scripts/firmware_id.sh)" >> "$GITHUB_OUTPUT"

    - name: Manifest script self-test
      run: python firmware/scripts/manifest.py --selftest

    - name: Config vectors are up to date
      run: |
        pip install protobuf==7.36.2 grpcio-tools==1.84.0
        python firmware/tools/gen_config_vectors.py
        git diff --exit-code firmware/test/golden/config.txt

    - name: Native tests
      working-directory: firmware
      run: pio test -e native

    - name: Build firmware (ESP32)
      working-directory: firmware
      env:
        VOLCO_FW_VERSION: ${{ steps.fwid.outputs.id }}
      run: |
        export VOLCO_FW_DISPLAY="ci+${GITHUB_SHA::7}"
        pio run -e esp32
        grep -q "\"version\": \"${VOLCO_FW_VERSION}\"" .pio/build/esp32/dist/firmware-manifest.json
        test -s .pio/build/esp32/relink/link-command.txt   # the LGPL relink bundle the release zip carries

    - name: Upload firmware
      uses: actions/upload-artifact@v7
      with:
        name: firmware-esp32
        path: firmware/.pio/build/esp32/dist/
        retention-days: 7

    # The Windows project only builds in the Windows job (on request only); compile it here too,
    # with this firmware embedded, so Windows-only code (the flasher, the audio engine), the
    # embedded resource names and the build-id check (spec §12.5) break on every push.
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        cache: true
        cache-dependency-path: Volco.sln

    - name: The Windows project embeds this firmware (RequireFirmware, resource names)
      run: |
        mkdir -p src/Volco.Windows/Firmware/esp32
        cp firmware/.pio/build/esp32/dist/* src/Volco.Windows/Firmware/esp32/
        dotnet build src/Volco.Windows/Volco.Windows.csproj --configuration Release -p:EnableWindowsTargeting=true \
          -p:RequireFirmware=true -p:VolcoFirmwareBuildId=${{ steps.fwid.outputs.id }}
        # The app opens "Firmware/esp32/firmware-manifest.json" exactly (a '\' from RecursiveDir would break it).
        grep -qa "Firmware/esp32/firmware-manifest.json" src/Volco.Windows/bin/Release/net8.0-windows10.0.22621.0/Volco.dll

    - name: RequireFirmware refuses another build's firmware
      run: |
        if dotnet build src/Volco.Windows/Volco.Windows.csproj --configuration Release -p:EnableWindowsTargeting=true \
             -p:RequireFirmware=true -p:VolcoFirmwareBuildId=000000000000 --no-incremental > mismatch.log 2>&1; then
          cat mismatch.log
          echo "RequireFirmware accepted a mismatched build id" >&2; exit 1
        fi
        grep -q "RequireFirmware: the embedded firmware isn't build 000000000000." mismatch.log || { cat mismatch.log; exit 1; }

  simulator-test:
    name: Simulator Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Install
      working-directory: tools/simulator/test
      run: npm ci

    - name: Check the protobuf descriptor is current
      working-directory: tools/simulator/test
      run: |
        node gen_descriptor.mjs
        git diff --exit-code ../volco_config_descriptor.js

    - name: Simulator tests
      working-directory: tools/simulator/test
      run: node --test

  build:
    name: Build and Publish
    # Manual only: never on push. Run it from the Actions tab or with
    # `gh workflow run build.yml --ref <branch> --field run_build=true`.
    if: github.event_name == 'workflow_dispatch' && inputs.run_build == true
    needs: firmware-test
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        cache: true
        cache-dependency-path: Volco.sln

    - name: Download firmware
      uses: actions/download-artifact@v8
      with:
        name: firmware-esp32
        path: src/Volco.Windows/Firmware/esp32

    - name: Publish
      run: |
        dotnet publish src/Volco.Windows/Volco.Windows.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:RequireFirmware=true `
          -p:VolcoFirmwareBuildId=${{ needs.firmware-test.outputs.build-id }} `
          -o ./publish/

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Volco-win-x64
        path: |
          ./publish/
          !./publish/lib*.pdb
        retention-days: 7
