name: Build Volco

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_build:
        description: 'Also run the Build and Publish job'
        type: boolean
        default: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        cache: true
        cache-dependency-path: Volco.sln

    - name: Test
      run: |
        dotnet test tests/Volco.Core.Tests/Volco.Core.Tests.csproj \
          --configuration Release
        dotnet test tests/Volco.App.Tests/Volco.App.Tests.csproj \
          --configuration Release

  build:
    name: Build and Publish
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_build == true)
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        cache: true
        cache-dependency-path: Volco.sln

    - name: Publish
      run: |
        dotnet publish src/Volco.Windows/Volco.Windows.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -o ./publish/

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Volco-win-x64
        path: ./publish/
        retention-days: 7
