name: Build Volco

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Volco.sln -p:Platform=x64

    - name: Build
      run: dotnet build Volco.sln --configuration Release --no-restore -p:Platform=x64

    - name: Test
      run: dotnet test Volco.sln --configuration Release --no-build --verbosity normal -p:Platform=x64

    - name: Publish
      run: dotnet publish src/Volco/Volco.csproj --configuration Release --output ./publish --self-contained true --runtime win-x64 -p:Platform=x64

    - name: Show XamlCompiler diagnostics
      if: failure()
      shell: pwsh
      run: |
        $objDir = "src/Volco/obj/x64/Release/net8.0-windows10.0.22621.0"
        Write-Host "=== input.json ==="
        $inp = "$objDir/input.json"
        if (Test-Path $inp) { Get-Content $inp } else { Write-Host "input.json not found" }
        Write-Host "=== output.json ==="
        $out = "$objDir/output.json"
        if (Test-Path $out) { Get-Content $out } else { Write-Host "output.json not found" }
        Write-Host "=== Run XamlCompiler directly ==="
        $xamlc = (Get-ChildItem "C:\Users\runneradmin\.nuget\packages\microsoft.windowsappsdk" -Recurse -Filter "XamlCompiler.exe" | Where-Object { $_.FullName -match "net472" } | Select-Object -First 1).FullName
        if ($xamlc -and (Test-Path $inp)) {
          & $xamlc $inp $out 2>&1
          Write-Host "XamlCompiler exit code: $LASTEXITCODE"
          if (Test-Path $out) { Write-Host "=== output.json (after direct run) ==="; Get-Content $out }
        } else { Write-Host "XamlCompiler or input.json not found: xamlc=$xamlc inp=$inp" }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Volco-win-x64
        path: ./publish/
        retention-days: 30
