name: Build Volco

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.304'  # Use a stable, older version

    - name: Install Windows Desktop workload
      run: dotnet workload install wasi-sdk

    - name: Clean NuGet Cache
      run: dotnet nuget locals all --clear

    - name: Restore dependencies
      run: dotnet restore Volco.sln -p:Platform=x64 --force --no-cache

    - name: Build
      # Added /v:diag for deep debugging
      # Added IntermediateOutputPath to prevent long-path crashes
      run: |
        dotnet build Volco.sln `
          --configuration Release `
          --no-restore `
          -p:Platform=x64 `
          -v diag

    - name: Test
      run: |
        dotnet test Volco.sln `
          --configuration Release `
          --no-build `
          --verbosity normal `
          -p:Platform=x64

    - name: Publish
      run: |
        dotnet publish src/Volco/Volco.csproj `
          --configuration Release `
          --output ./publish `
          --self-contained true `
          --runtime win-x64 `
          -p:Platform=x64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Volco-win-x64
        path: ./publish/
        retention-days: 30
