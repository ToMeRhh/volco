name: Build Volco

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    # Ensuring the runner has the right permissions for a private repo
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      # Using MSBuild for restore to ensure WinUI targets are mapped correctly
      run: msbuild Volco.sln -t:restore -p:Platform=x64

    - name: Build
      # We redirect the intermediate output to C:\b\ to avoid long path errors
      # This is the step that usually fixes the MSB3073 / XamlCompiler crash
      run: |
        msbuild Volco.sln `
          -p:Configuration=Release `
          -p:Platform=x64 `
          -p:IntermediateOutputPath=C:\b\ `
          -p:OutputPath=D:\a\volco\volco\bin\Release\

    - name: Test
      run: dotnet test Volco.sln --configuration Release --no-build --verbosity normal -p:Platform=x64

    - name: Publish
      # We use dotnet publish for the final step as it handles the trimming/packaging well
      run: |
        dotnet publish src/Volco/Volco.csproj `
          --configuration Release `
          --output ./publish `
          --self-contained true `
          --runtime win-x64 `
          -p:Platform=x64 `
          -p:IntermediateOutputPath=C:\b\p\

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Volco-win-x64
        path: ./publish/
        retention-days: 30
