name: Release Volco

# Publish a stamped release build with the single-file Volco.exe attached. The in-app updater
# discovers builds via this Release. Trigger it either by pushing a semver tag (e.g. v1.2.3) or by
# running the workflow manually from the Actions tab and supplying a version (creates the tag too).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0 or v0.1.0)'
        required: true
        type: string

jobs:
  release:
    name: Build and Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Resolve version and tag
      id: ver
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          raw="${{ github.event.inputs.version }}"
        else
          raw="${GITHUB_REF_NAME}"
        fi
        version="${raw#v}"          # build version, no leading v (e.g. 0.1.0)
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "tag=v${version}" >> "$GITHUB_OUTPUT"

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
        cache: true
        cache-dependency-path: Volco.sln

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Publish
      run: |
        msbuild src/Volco/Volco.csproj `
          -t:Publish `
          -m `
          -restore `
          -p:Configuration=Release `
          -p:Platform=x64 `
          -p:PublishDir=../../publish/ `
          -p:RuntimeIdentifier=win-x64 `
          -p:SelfContained=true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -p:VolcoVersion=${{ steps.ver.outputs.version }} `
          -p:VolcoReleaseChannel=release

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        # For a tag push the tag already exists; for a manual run gh creates it at --target.
        gh release create "${{ steps.ver.outputs.tag }}" \
          --title "Volco ${{ steps.ver.outputs.tag }}" \
          --target "${{ github.sha }}" \
          --generate-notes \
          ./publish/Volco.exe
