<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volco WebSocket Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slider-vertical {
            appearance: slider-vertical;
            width: 8px;
            height: 200px;
            padding: 0 5px;
        }
        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: background-color 0.15s;
        }
        .led-off { background-color: #374151; box-shadow: none; }
        .led-on-red { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .led-on-green { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .led-on-blue { background-color: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-2xl border border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-400">Volco Simulator</h1>

        <!-- Connection Config -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 items-end">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Host</label>
                <input id="host" type="text" value="localhost" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Port</label>
                <input id="port" type="number" value="8765" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <button id="connectBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition-colors">
                Connect
            </button>
        </div>

        <div class="flex items-center gap-4 mb-8 justify-center">
            <div class="flex items-center gap-2">
                <div id="statusDot" class="w-3 h-3 rounded-full bg-red-500"></div>
                <span id="statusText" class="text-sm font-medium text-gray-300">Disconnected</span>
            </div>
            <label class="flex items-center gap-1.5 text-xs text-gray-400 cursor-pointer select-none">
                <input id="autoReconnect" type="checkbox" class="accent-blue-500">
                Auto-reconnect
            </label>
        </div>

        <div class="flex flex-col md:flex-row gap-12 justify-center items-start">
            <!-- Sliders -->
            <div class="flex gap-6">
                <template id="sliderTemplate">
                    <div class="flex flex-col items-center gap-3">
                        <input type="range" min="0" max="4095" value="2048" class="slider-vertical">
                        <span class="text-xs font-mono text-gray-400">S[ID]</span>
                        <span class="text-xs font-mono text-blue-400 value-display">2048</span>
                    </div>
                </template>
                <div id="slidersContainer" class="flex gap-6"></div>
            </div>

            <!-- Buttons -->
            <div class="flex flex-col gap-4">
                <div id="buttonsContainer" class="flex flex-col gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectTimer = null;
        const RECONNECT_INTERVAL = 3000;

        const hostInput = document.getElementById('host');
        const portInput = document.getElementById('port');
        const connectBtn = document.getElementById('connectBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const autoReconnectCheckbox = document.getElementById('autoReconnect');
        const slidersContainer = document.getElementById('slidersContainer');
        const buttonsContainer = document.getElementById('buttonsContainer');
        const sliderTemplate = document.getElementById('sliderTemplate');

        // LED state references
        const leds = {
            mute: [null, null],      // mute button 0, 1
            device: [null, null]     // device selector LED 0, 1
        };

        // Throttle helper — sends at most once per interval, always sends final value
        function throttle(fn, ms) {
            let lastCall = 0;
            let pending = null;
            return function(...args) {
                const now = Date.now();
                if (now - lastCall >= ms) {
                    lastCall = now;
                    fn(...args);
                } else {
                    clearTimeout(pending);
                    pending = setTimeout(() => {
                        lastCall = Date.now();
                        fn(...args);
                    }, ms - (now - lastCall));
                }
            };
        }

        // Create 5 sliders
        for (let i = 0; i < 5; i++) {
            const clone = sliderTemplate.content.cloneNode(true);
            const slider = clone.querySelector('input');
            const label = clone.querySelector('span');
            const display = clone.querySelector('.value-display');

            label.textContent = `S${i}`;
            slider.dataset.index = i;

            const throttledSend = throttle((val) => sendSlider(i, val), 20);

            slider.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                display.textContent = val;
                throttledSend(val);
            });

            slidersContainer.appendChild(clone);
        }

        // Create buttons with LED indicators
        const buttonDefs = [
            { index: 0, label: 'Mute 0', ledType: 'mute', ledIndex: 0 },
            { index: 1, label: 'Mute 1', ledType: 'mute', ledIndex: 1 },
            { index: 2, label: 'Device Sel', ledType: 'device' },
        ];

        for (const def of buttonDefs) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-center gap-3';

            const btn = document.createElement('button');
            btn.className = 'w-28 h-12 bg-gray-700 hover:bg-gray-600 active:bg-blue-600 rounded-lg border border-gray-600 font-bold transition-all flex items-center justify-center text-sm';
            btn.textContent = def.label;

            btn.addEventListener('pointerdown', () => { btn.dataset.pressed = '1'; sendButton(def.index, 1); });
            btn.addEventListener('pointerup', () => { btn.dataset.pressed = '0'; sendButton(def.index, 0); });
            btn.addEventListener('pointerleave', () => {
                if (btn.dataset.pressed === '1') {
                    btn.dataset.pressed = '0';
                    sendButton(def.index, 0);
                }
            });

            wrapper.appendChild(btn);

            if (def.ledType === 'mute') {
                const led = document.createElement('div');
                led.className = 'led led-off';
                led.title = 'Mute LED';
                wrapper.appendChild(led);
                leds.mute[def.ledIndex] = led;
            } else if (def.ledType === 'device') {
                const ledContainer = document.createElement('div');
                ledContainer.className = 'flex gap-1.5';
                for (let d = 0; d < 2; d++) {
                    const led = document.createElement('div');
                    led.className = 'led led-off';
                    led.title = `Device ${d}`;
                    ledContainer.appendChild(led);
                    leds.device[d] = led;
                }
                wrapper.appendChild(ledContainer);
            }

            buttonsContainer.appendChild(wrapper);
        }

        connectBtn.addEventListener('click', () => {
            if (ws) {
                clearReconnectTimer();
                ws.close();
            } else {
                connect();
            }
        });

        function clearReconnectTimer() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
        }

        function scheduleReconnect() {
            if (autoReconnectCheckbox.checked && !reconnectTimer && !ws) {
                reconnectTimer = setTimeout(() => {
                    reconnectTimer = null;
                    if (!ws && autoReconnectCheckbox.checked) {
                        statusText.textContent = 'Reconnecting...';
                        connect();
                    }
                }, RECONNECT_INTERVAL);
            }
        }

        function setDisconnected() {
            statusDot.className = 'w-3 h-3 rounded-full bg-red-500';
            statusText.textContent = 'Disconnected';
            connectBtn.textContent = 'Connect';
            connectBtn.className = 'bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition-colors';
            ws = null;
            // Reset LEDs on disconnect
            for (const led of leds.mute) if (led) led.className = 'led led-off';
            for (const led of leds.device) if (led) led.className = 'led led-off';
        }

        function connect() {
            const url = `ws://${hostInput.value}:${portInput.value}/`;
            ws = new WebSocket(url);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                statusDot.className = 'w-3 h-3 rounded-full bg-green-500';
                statusText.textContent = 'Connected';
                connectBtn.textContent = 'Disconnect';
                connectBtn.className = 'bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded transition-colors';
            };

            ws.onmessage = (event) => {
                const data = new Uint8Array(event.data);
                parseIncoming(data);
            };

            ws.onclose = () => {
                setDisconnected();
                scheduleReconnect();
            };

            ws.onerror = (err) => {
                console.error('WebSocket Error:', err);
            };
        }

        // ============ Incoming message parser ============

        const RX_WAIT_START = 0, RX_WAIT_LENGTH = 1, RX_WAIT_PAYLOAD = 2, RX_WAIT_CHECKSUM = 3;
        let rxState = RX_WAIT_START;
        let rxPayload = [];
        let rxExpectedLen = 0;

        function parseIncoming(data) {
            for (let i = 0; i < data.length; i++) {
                processReceivedByte(data[i]);
            }
        }

        function processReceivedByte(b) {
            switch (rxState) {
                case RX_WAIT_START:
                    if (b === 0xAA) rxState = RX_WAIT_LENGTH;
                    break;
                case RX_WAIT_LENGTH:
                    rxExpectedLen = b;
                    rxPayload = [];
                    if (rxExpectedLen === 0 || rxExpectedLen > 32) {
                        rxState = RX_WAIT_START;
                    } else {
                        rxState = RX_WAIT_PAYLOAD;
                    }
                    break;
                case RX_WAIT_PAYLOAD:
                    rxPayload.push(b);
                    if (rxPayload.length >= rxExpectedLen) {
                        rxState = RX_WAIT_CHECKSUM;
                    }
                    break;
                case RX_WAIT_CHECKSUM: {
                    let checksum = 0;
                    for (const pb of rxPayload) checksum ^= pb;
                    if (checksum === b) {
                        handleServerMessage(rxPayload);
                    }
                    rxState = RX_WAIT_START;
                    break;
                }
            }
        }

        function handleServerMessage(payload) {
            if (payload.length < 2) return;
            const type = payload[0];

            if (type === 0x03 && payload.length >= 3) {
                // Mute state: button_index, mute_state
                const btnIndex = payload[1];
                const muted = payload[2] !== 0;
                if (btnIndex < 2 && leds.mute[btnIndex]) {
                    leds.mute[btnIndex].className = muted ? 'led led-on-red' : 'led led-off';
                }
            } else if (type === 0x04 && payload.length >= 2) {
                // Active device: device_index
                const deviceIndex = payload[1];
                for (let d = 0; d < 2; d++) {
                    if (leds.device[d]) {
                        leds.device[d].className = (d === deviceIndex) ? 'led led-on-green' : 'led led-off';
                    }
                }
            }
        }

        // ============ Outgoing messages ============

        function sendSlider(index, value) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            const payload = new Uint8Array(4);
            payload[0] = 0x01; // Type: Slider
            payload[1] = index;
            payload[2] = (value >> 8) & 0xFF;
            payload[3] = value & 0xFF;

            sendFrame(payload);
        }

        function sendButton(index, state) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            const payload = new Uint8Array(3);
            payload[0] = 0x02; // Type: Button
            payload[1] = index;
            payload[2] = state; // 1 = pressed, 0 = released

            sendFrame(payload);
        }

        function sendFrame(payload) {
            let checksum = 0;
            for (let i = 0; i < payload.length; i++) {
                checksum ^= payload[i];
            }

            const frame = new Uint8Array(payload.length + 3);
            frame[0] = 0xAA; // Start marker
            frame[1] = payload.length;
            frame.set(payload, 2);
            frame[frame.length - 1] = checksum;

            ws.send(frame.buffer);
        }
    </script>
</body>
</html>
