[platformio]
default_envs = denky32

[env:denky32]
; Exact pins: CI and every dev machine must build the same core (spec §7).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    links2004/WebSockets@2.7.3
    olikraus/U8g2@2.36.18
test_ignore = *

; Host-side unit tests of the pure libraries in lib/ (protocol, bidi, screen state, render).
; Run with: pio test -e native
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -DVOLCO_NATIVE
test_build_src = no

; Build-only check that the screen code compiles (2 screens on bus 0). Not for flashing.
[env:denky32_screens_check]
extends = env:denky32
build_flags =
    ${env:denky32.build_flags}
    -DVOLCO_SCREENS_CHECK

; Build-only checks of the Wi-Fi transports (the default build compiles only TRANSPORT_SERIAL).
[env:denky32_udp_check]
extends = env:denky32
build_flags =
    ${env:denky32.build_flags}
    -DTRANSPORT_UDP

[env:denky32_websocket_check]
extends = env:denky32
build_flags =
    ${env:denky32.build_flags}
    -DTRANSPORT_WEBSOCKET

; SPIKE ONLY (stage 1) — removed before merge.
[env:spike_layout]
extends = env:denky32
extra_scripts = post:../spikes/print_flash_layout.py
