[platformio]
default_envs = esp32

[env:esp32]
; Exact pins: CI and every dev machine must build the same core (spec §7).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
; Pinned so NVS stays at 0x9000/0x5000 (spec §6.6): updates and erase-region rely on it.
board_build.partitions = default.csv
; The build id define (pre) and the dist/ folder with the manifest the app installs from (post).
extra_scripts =
    pre:scripts/version.py
    post:scripts/manifest.py
    post:scripts/relink_bundle.py
framework = arduino
; Each chip family builds its own folder of src/ (docs/design/arduino-avr.md §6.1).
build_src_filter = +<esp32/>
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@2.36.18
    nanopb/Nanopb@0.4.92
; The controller config, generated from the repo's proto/ (spec §7).
custom_nanopb_protos = +<../proto/volco_config.proto>
custom_nanopb_options = --error-on-unmatched
build_flags =
    -std=gnu++17
    -DPB_VALIDATE_UTF8
build_unflags =
    -std=gnu++11
test_ignore = *

; Host-side unit tests of the pure libraries in lib/ (protocol, bidi, screen state, render, config).
; Run with: pio test -e native
[env:native]
platform = native
lib_deps =
    nanopb/Nanopb@0.4.92
; Generated from the repo's proto/ (spec §7); nanopb picks up the .options file next to it.
custom_nanopb_protos = +<../proto/volco_config.proto>
custom_nanopb_options = --error-on-unmatched
build_flags =
    -std=gnu++17
    -Wall
    -DVOLCO_NATIVE
    -DPB_VALIDATE_UTF8
test_build_src = no
