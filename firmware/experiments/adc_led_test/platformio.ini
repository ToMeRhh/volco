; Throwaway experiment: does lighting an indicator LED shift the slider ADC readings?
; Pins are the diy-reference preset's. Leaves NVS alone (same partition table as the
; real firmware), so the stored Volco config survives; reflash Volco afterwards.
;
;   cd firmware/experiments/adc_led_test
;   pio run -t upload && pio device monitor

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
board_build.partitions = default.csv
framework = arduino
monitor_speed = 115200
monitor_echo = yes
